<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>magikdex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- PWA: installable standalone shell. black-translucent lets the app draw
         under the notch so the safe-area insets do the spacing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="magikdex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700;800&family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* The margin/padding reset lives in src/styles.css (@layer base): unlayered
         here it would beat every Tailwind utility. */
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #060a0a;
      }
      /* Paged surfaces (the Box detail pane) scroll-snap horizontally. The
         scrollbar has to go or it reads as a stray rule across the pane —
         a pseudo-element, so it cannot be an inline style. */
      .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }

      /* Motion + tap feedback (2026-11-10 smoothness pass). Short and
         ease-out so it reads as responsive, never as waiting. */
      .press { transition: transform 120ms ease-out, opacity 120ms ease-out; }
      .press:active:not(:disabled) { transform: scale(0.97); opacity: 0.85; }
      .screen-track { transition: margin-left 260ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      .fade-in  { animation: md-fade 180ms ease-out; }
      .sheet-up { animation: md-sheet-up 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      .takeover-in { animation: md-takeover 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      .ring-in  { animation: md-ring 160ms ease-out; }
      @keyframes md-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes md-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
      /* No transform at the end state (animation, not fill-mode): Brew's
         position:fixed children need the viewport as their containing block. */
      @keyframes md-takeover { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes md-ring { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        .press, .screen-track { transition: none; }
        .fade-in, .sheet-up, .takeover-in, .ring-in { animation: none; }
        .press:active:not(:disabled) { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
